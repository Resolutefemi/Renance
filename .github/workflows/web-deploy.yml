name: web-deploy (GitHub Pages)

# Builds the Next.js static export and publishes it to GitHub Pages:
# https://<owner>.github.io/<repo>/
#
# Pages source must be "GitHub Actions" (Settings -> Pages). Set the
# PUBLIC_API_BASE repo variable to the deployed https study API.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bake static question bundles into the export
        run: python3 scripts/web_bundles.py

      - name: Build static export
        working-directory: apps/web
        env:
          # Project site -> served under /<repo>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Must be https once set — browsers block http from an https origin.
          NEXT_PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE || 'http://localhost:3990' }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          # Google sign-in button — falls back to the shipped WEB client ID
          # (public value, same as render.yaml); override via repo Variables if rotated.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '850087098854-pni8gohld0isi8v8nhhnlcl5fuvi77q4.apps.googleusercontent.com' }}
          # Browser-side AI fallback (same Gemini provider the study API
          # uses server-side). The key rides the client bundle because
          # Pages is static; every AI surface degrades gracefully without it.
          NEXT_PUBLIC_AI_API_KEY: ${{ secrets.AI_API_KEY || '' }}
          NEXT_PUBLIC_AI_BASE_URL: ${{ vars.NEXT_PUBLIC_AI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          NEXT_PUBLIC_AI_MODEL: ${{ vars.NEXT_PUBLIC_AI_MODEL || 'gemini-3.6-flash' }}
        run: pnpm exec next build

      - name: SPA fallback (unknown paths -> home)
        run: cp apps/web/out/index.html apps/web/out/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
