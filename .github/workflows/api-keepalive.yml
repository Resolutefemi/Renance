name: api-keepalive (Render free tier)

# The study API runs on Render's free plan, which spins the service down
# after ~15 minutes idle; the next student then eats a 30-60s cold start
# before a single question renders. A light ping every 10 minutes keeps
# the service warm (and stays inside the free instance-hours allowance).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
            "${{ vars.PUBLIC_API_BASE || 'https://renance-api.onrender.com' }}/healthz")
          echo "healthz -> $code"
          test "$code" = "200"
