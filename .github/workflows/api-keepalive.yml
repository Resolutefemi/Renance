name: api-keepalive (Render free tier)

# The study API runs on Render's free plan, which spins the service down
# after ~15 minutes idle; the next student then eats a 30-60s cold start
# before a single question renders. A light ping every 5 minutes keeps
# the service warm (and stays inside the free instance-hours allowance).
# 5-minute spacing (founder bugfix 2026-10-05): GitHub's shared queue
# delays scheduled runs by wide margins on free repos - the old */10
# schedule actually landed only 3-6 times a DAY, far too few to matter.
# Denser cron = more chances to land a warm-up between real students.
# Each ping also touches Postgres (/healthz pings the DB), which keeps
# the Neon compute from suspending between lessons.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          base="${{ vars.PUBLIC_API_BASE || 'https://renance-api.onrender.com' }}"
          # A cold start can eat the whole first window, and one lost
          # packet on the runner used to paint the whole run red. Try a
          # few times with fresh sockets before giving up: the ping is
          # a courtesy, not a production check.
          for attempt in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
              "$base/healthz")
            echo "attempt $attempt: healthz -> $code"
            test "$code" = "200" && exit 0
            sleep 20
          done
          echo "health endpoint never answered 200 after 4 attempts"
          exit 1
