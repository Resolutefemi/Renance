# Render Blueprint, one-click deploy of the Renance study API (free plan).
#
# Render.com -> New + -> Blueprint -> pick Resolutefemi/Renance -> Apply.
# DATABASE_URL ships FILLED IN (founder directive 2026-10-16: "point
# DATABASE_URL at the Supabase pooler DSN - the full cache serves
# immediately"): the primary is now the Supabase SESSION-mode pooler DSN,
# the database that already carries the full 15-unit x 10-topic ladder
# for every one of the 10,725 courses (1.6M+ topics, 149k units) plus
# every account mirrored from Neon by the dual-write mirror. Everything
# else is filled in, JWT_SECRET is generated for you and
# GOOGLE_CLIENT_ID ships with both public OAuth client IDs (web +
# Android), so Google sign-in works on the first boot.
#
# Prefer the dashboard instead? Render.com -> renance-api -> Environment
# -> DATABASE_URL -> paste the Supabase pooler DSN below -> Save Changes
# (the service redeploys itself; the same value is baked here so a
# blueprint sync applies it either way).
#
# VERIFIED 2026-09-07: the live service at https://renance-api.onrender.com
# answers /healthz {"db":"ok"} and the full student-flow E2E
# (scripts/api-e2e.sh) passes against it end to end.
#
# Free plan note: the service sleeps after ~15 min idle; the first request
# wakes it in ~30-50s. Upgrade any time for always-on.
#
# WEB_ORIGIN is the CORS allowlist for the browser clients: the custom
# domain (renance.app), the Vercel deployment (renance-edtech.vercel.app),
# the GitHub Pages site and local dev. The Flutter apps need no CORS and
# are unaffected by it. Exact-match: every origin students may sign in
# from must be listed or the browser blocks every API call.

services:
  - type: web
    name: renance-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/study-api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # NEON COMPUTE BUDGET (2026-10-14): /healthz is DB-free on purpose.
    # Any uptime monitor / keep-warm cron must point at
    #   https://renance-api.onrender.com/app-version   (or /healthz)
    # NEVER at /readyz (real Postgres probe), /internal/review/tick or
    # any other endpoint - a ping that touches Postgres every few
    # minutes keeps the 0.25-CU compute awake 24/7, which is exactly
    # how the 100 CU-hour free allowance was on track to run out by
    # mid-month. /readyz exists for humans + CI to verify the Neon
    # connection on demand.
    autoDeploy: true
    envVars:
      # PRIMARY / USER domain (founder directive 2026-10-16: "users
      # details and progress are stored in Neon and InsForge alone,
      # Supabase should only hold the courses, topics and units" +
      # "do this yourself" with the Neon pooled DSN pasted in chat):
      #   USER_DATABASE_URL    = the user database (accounts, progress,
      #                          streaks, achievements, follows, quiz
      #                          results). SET BY THE AGENT 2026-10-16,
      #                          SECOND CUT: the founder's Neon POOLED
      #                          DSN, baked here AND as the code default
      #                          (store.bakedUserDSN) - whichever the
      #                          blueprint sync applies, Neon wins. The
      #                          agent provisioned Neon ahead of this
      #                          deploy with dbsplit (copy-users carried
      #                          the 112 accounts off Supabase exactly
      #                          once, seal-backfill sealed the marker,
      #                          reap-user-stale dropped the pre-split
      #                          husks), so the first boot here just
      #                          connects and serves. InsForge #1
      #                          (INSFORGE_DATABASE_URL below) stays on
      #                          as the user MIRROR; after one verified
      #                          boot run dbsplit reap-supabase-users
      #                          --yes and Supabase is catalog-only.
      #   CONTENT_DATABASE_URL = Supabase (baked below): the catalog
      #                          ONLY - departments, courses, units,
      #                          topics. The lesson cache and the user
      #                          tables live elsewhere, so Supabase
      #                          stops filling.
      #   CACHE_DATABASE_URL   = InsForge #1 (dbeqj4dx, baked below + as
      #                          the code default store.bakedCacheDSN):
      #                          the lesson cache home since the
      #                          2026-10-16 move (founder directive:
      #                          "don't use insforge #2 for lesson cache
      #                          only use #1" - #2 turned out to be the
      #                          500 MB free tier while the cache had
      #                          grown to 901 MB). The newest ~36k
      #                          cached lessons were carried over
      #                          dblink (server to server) and the 887
      #                          MB table was dropped off #2, so the
      #                          430 MB cap (LESSON_CACHE_CAP_MB below)
      #                          keeps mirror + cache inside #1's own
      #                          500 MB tier with headroom.
      # DATABASE_URL stays the legacy/fallback DSN (Supabase): a
      # failover handle for the user chain and the content failover.
      - key: DATABASE_URL
        value: "postgresql://postgres.zfxrmcwdnmmxjawmsiyp:Stephen2474life%23@aws-1-eu-west-3.pooler.supabase.com:5432/postgres?sslmode=require"
      - key: USER_DATABASE_URL
        value: "postgresql://neondb_owner:npg_siaeB4m7IMUZ@ep-snowy-base-axf83q3b-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
      # NEON CU CALLBACK PLAN (founder 2026-10-16, Neon at 84% of the
      # monthly compute): the user chain now fails over to InsForge #1
      # (the live dual-write mirror) BEFORE the legacy Supabase handle -
      # store.bakedUserFallbackDSN carries it in code. When Neon's free
      # tier runs dry the API keeps serving login/signup/progress from
      # the mirror; when Neon resets it wins the chain again at boot and
      # `dbsplit adopt-mirror` carries outage-window rows back.
      # Dashboard knob that helps most: Neon -> your project -> Compute
      # -> Suspend timeout -> 60 seconds (scale to zero between lulls).
      - key: CONTENT_DATABASE_URL
        value: "postgresql://postgres.zfxrmcwdnmmxjawmsiyp:Stephen2474life%23@aws-1-eu-west-3.pooler.supabase.com:5432/postgres?sslmode=require"
      # Lesson cache cap for the CACHE database (InsForge #1, the 500 MB
      # free tier that also carries the user mirror): the guard pauses
      # new lesson writes past this size (it probes the whole DATABASE
      # size, and mirror + lessons share it) - lessons still serve from
      # the deterministic engine either way. 430 leaves ~60 MB of write
      # headroom inside the plan. Raise only after a plan upgrade.
      - key: LESSON_CACHE_CAP_MB
        value: "430"
      # ── Multi-database fallback (founder directive 2026-10-15: "can
      # the project share two databases, or use another as a backup
      # when the first one's free trial ends?") ─────────────────────
      # At boot the API walks DATABASE_URL (Supabase since 2026-10-16)
      # first, then SUPABASE_DATABASE_URL, then INSFORGE_DATABASE_URL. The
      # first live DSN wins; migrations + the curriculum seed provision
      # it automatically. Runtime detection is CU-aware (dbwatch.go):
      # it only probes after real request failures, never on a
      # schedule, so nothing here ever keeps Neon's compute awake.
      #
      # FOUNDER DIRECTIVE 2026-10-15 ("set up the database and
      # everything yourself and make it's working"): both fallback DSNs
      # are the VERIFIED, PROVISIONED values baked in below (the repo is
      # private - the same practice as BUNDLE_MASTER_KEY above).
      # 2026-10-16 role change: SUPABASE_DATABASE_URL is the CONTENT
      # database's failover handle (and the legacy user fallback while
      # USER_DATABASE_URL is unset); it is no longer a user-mirror
      # target once the split is live - the router excludes the content
      # database from the user mirror list. Both
      # databases were migrated + curriculum-seeded (293 departments /
      # 10,725 courses / 130,275 topics) and the full student desk flow
      # was E2E-verified against BOTH on 2026-10-15.
      #   SUPABASE: session mode (5432) of the project's supavisor
      #     pooler, aws-1-eu-west-3 - the IPv4-safe host (the direct
      #     db.<ref>.supabase.co host is IPv6-only and unreachable from
      #     Render's egress). Rotate the password in the Supabase
      #     dashboard any time: update it here AND in the GitHub Actions
      #     secret SUPABASE_DATABASE_URL (db-keepalive workflow).
      #   INSFORGE: the wire-verified DSN (dbeqj4dx, us-east) - the
      #     user MIRROR and since 2026-10-16 ALSO the lesson cache home
      #     (cache and mirror share the database under the 430 MB cap;
      #     the second InsForge, 6zctb6jv, was retired from cache duty
      #     - it is the 500 MB free tier and the cache had outgrown it).
      - key: SUPABASE_DATABASE_URL
        value: "postgresql://postgres.zfxrmcwdnmmxjawmsiyp:Stephen2474life%23@aws-1-eu-west-3.pooler.supabase.com:5432/postgres?sslmode=require"
      - key: INSFORGE_DATABASE_URL
        value: "postgresql://postgres:8261cb984054ff872330f6b73200eb99@dbeqj4dx.us-east.database.insforge.app:5432/insforge?sslmode=require"
      # CACHE_DATABASE_URL above carries the SAME dbeqj4dx DSN: since
      # the 2026-10-16 move the cache lives with the mirror on InsForge
      # #1. Keepalives + synthgen top-ups target it via the
      # INSFORGE_DATABASE_URL GitHub secret convention (the Actions
      # secret points at THIS database). The retired cache host
      # (6zctb6jv, InsForge #2) now holds no Renance tables - keep it
      # as a cold spare or delete the project.
      - key: CACHE_DATABASE_URL
        value: "postgresql://postgres:8261cb984054ff872330f6b73200eb99@dbeqj4dx.us-east.database.insforge.app:5432/insforge?sslmode=require"
      # Explicit ordered chain (comma-separated) overrides the two
      # named vars above when set.
      - key: FALLBACK_DATABASE_URLS
        sync: false
      # ── Dual-write mirror (founder directive 2026-10-15: "make sure
      # you copy all the user details, all the dB, to Supabase too, and
      # everything should save simultaneously on both neon and Supabase
      # at once") ─────────────────────────────────────────────────────
      # Both default ON; listed here so the dashboards show the
      # switches. Every write the primary (Neon) accepts replays
      # asynchronously to Supabase and InsForge (store/mirror.go); the
      # boot sync (store/mirrorsync.go) copies any rows a mirror is
      # missing - the first boot after this deploys copies every live
      # account/progress row off Neon onto both mirrors, and every
      # later boot pays one COUNT per table. Run history is visible in
      # BOTH dashboards: public.mirror_sync (next to db_keepalive).
      #   MIRROR_WRITES=0 -> classic single-pool behaviour, no mirror
      #     connections at all.
      #   MIRROR_SYNC=0   -> writes still mirror, but no boot row-merge.
      - key: MIRROR_WRITES
        value: "1"
      - key: MIRROR_SYNC
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 850087098854-pni8gohld0isi8v8nhhnlcl5fuvi77q4.apps.googleusercontent.com,850087098854-5rj3vig6fpm4k2jie4najsoq6tpcdm6f.apps.googleusercontent.com,850087098854-ees3f4uu8ihsqtfjjleq2ghdkv5qgn5n.apps.googleusercontent.com
      - key: WEB_ORIGIN
        value: https://renance.app,https://www.renance.app,https://renance-edtech.vercel.app,https://resolutefemi.github.io,http://localhost:3000,http://127.0.0.1:3000
      - key: SITE_URL
        value: https://renance.app
      # Renance AI (founder directive: Z.ai ONLY - Groq's key was revoked
      # and is removed, Gemini is gone). The key is the Z.ai production
      # key baked here per founder instruction; it is read only by the
