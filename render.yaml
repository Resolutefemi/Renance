      # The cache DB (InsForge #1) was truncated after the backfill
      # verified, so this env MUST stay complete or lessons fall back
      # to on-demand generation. All four values are baked (the
      # "users own" Object Read & Write token scoped to this bucket;
      # repo is private - same practice as BUNDLE_MASTER_KEY). Mixing
      # a new access key with an old dashboard secret breaks auth and
      # silently inert-R2s the API - keep the four in sync.
      # Ops doctrine: 1 Class A PUT per generated lesson, LIST pages
      # 1 op/1000 keys, reads are Class B (10M/month free). Founder
      # budget: <=300k Class A ops for the 8GB archive era (at the
      # 21KB avg blob that is ~388k objects, so richer lessons or a
      # slightly higher budget are the levers - never chunked PUTs).
      - key: R2_BUCKET
        value: "renance"
      - key: R2_ACCOUNT_ID
        value: "ff1e18e32afe87e8e07b3c35595fdd0e"
      - key: R2_ACCESS_KEY_ID
        value: "78b8e71ffccaf0bdf12b95a6b108000f"
      - key: R2_SECRET_ACCESS_KEY
        value: "38a5c0c95e93a6adb6bbb41a6c1297242d07c48ad23c0405bb631830083852d2"
