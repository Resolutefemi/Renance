      # https://resend.com/emails.
      - key: RESEND_API_KEY
        value: re_LMM1duMH_HHc3mNaxvNHtkjzrmKBadCaB
      - key: RESEND_FROM
        value: "Renance <verify@renance.app>"
      # Paystack: paste the secret key and card payments switch on.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # ── Cloudflare R2 lesson blobs (the durable lesson home since
      # 2026-10-16, commit 94a61e8: the bucket is the home, the cache
      # DB is the index; reads fall back R2 -> DB -> generation, writes
      # are dual bucket+DB and a bucket failure never fails a lesson).
      # FOUNDER DIRECTIVE 2026-10-18 (final cut): the bucket is
      # "renance" - it exists in the Cloudflare account (created
      # 2026-10-17, the account's only bucket) and the ENTIRE lesson
