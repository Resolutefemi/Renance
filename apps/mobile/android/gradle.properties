# Sized for a 4GB CI/sandbox runner: the template default (-Xmx8G) gets the
# gradle daemon OOM-killed here ("daemon disappeared unexpectedly").
# R8 minify needs a bigger heap than the old 1400m budget, so the daemon
# gets 2G, workers run one-at-a-time, and the Kotlin daemon shrinks to fit.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:MaxMetaspaceFreeRatio=40 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx512m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
