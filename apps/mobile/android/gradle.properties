# Sized for a 4GB CI/sandbox runner: the template default (-Xmx8G) gets the
# gradle daemon OOM-killed here ("daemon disappeared unexpectedly").
org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx700m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
