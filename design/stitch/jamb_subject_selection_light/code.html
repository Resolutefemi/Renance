<script>
    document.addEventListener('DOMContentLoaded', () => {
      const maxSelections = 4;
      const mandatorySubject = 'english';
      
      const counterEl = document.getElementById('selection-counter');
      const progressEl = document.getElementById('progress-bar');
      const startBtn = document.getElementById('start-btn');
      const buttons = document.querySelectorAll('.subject-btn');
      
      let selectedSubjects = new Set(['english', 'physics']); // Initial state from HTML

      function updateUI() {
        const count = selectedSubjects.size;
        
        // Update Counter text
        counterEl.textContent = `${count}/${maxSelections}`;
        counterEl.className = count === maxSelections ? 'text-primary font-bold' : 'text-accent-emerald';
        
        // Update Progress bar width
        progressEl.style.width = `${(count / maxSelections) * 100}%`;
        progressEl.className = `h-full transition-all duration-300 ease-out rounded-full ${count === maxSelections ? 'bg-primary' : 'bg-accent-emerald'}`;

        // Update Start Button
        if (count === maxSelections) {
          startBtn.className = "w-full h-[52px] bg-primary text-on-primary font-body-medium rounded-[10px] pointer-events-auto transition-all flex items-center justify-center gap-2 shadow-md active:scale-[0.98]";
          startBtn.querySelector('span').style.fontVariationSettings = "'FILL' 1";
        } else {
           startBtn.className = "w-full h-[52px] bg-primary/40 text-on-primary/50 font-body-medium rounded-[10px] pointer-events-auto transition-all flex items-center justify-center gap-2 cursor-not-allowed";
           startBtn.querySelector('span').style.fontVariationSettings = "'FILL' 0";
        }

        // Update visual states of all buttons to handle max selection disabling
        buttons.forEach(btn => {
           const id = btn.getAttribute('data-subject');
           const isSelected = selectedSubjects.has(id);
           
           if (!isSelected && count >= maxSelections) {
              btn.classList.add('opacity-50', 'grayscale');
           } else {
              btn.classList.remove('opacity-50', 'grayscale');
           }
        });
      }

      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-subject');
          const isSelected = btn.getAttribute('aria-pressed') === 'true';

          if (isSelected) {
            // Deselect
            selectedSubjects.delete(id);
            btn.setAttribute('aria-pressed', 'false');
            
            // Visual reset
            btn.classList.replace('bg-surface-container', 'bg-card');
            btn.classList.replace('border-accent-emerald', 'border-transparent');
            btn.classList.add('hover:bg-surface-container-low');
            
            const iconContainer = btn.querySelector('.icon-container');
            iconContainer.classList.replace('bg-accent-emerald', 'bg-surface-container');
            iconContainer.classList.replace('text-white', 'text-on-surface-variant');
            
            const checkContainer = btn.querySelector('.check-container');
            checkContainer.classList.replace('bg-accent-emerald', 'border-outline-light');
            checkContainer.classList.remove('border-transparent');
            
            const checkIcon = btn.querySelector('.material-symbols-outlined:last-child');
            checkIcon.classList.replace('opacity-100', 'opacity-0');
            checkIcon.classList.replace('scale-100', 'scale-50');
            checkIcon.style.fontVariationSettings = "'FILL' 0";

          } else {
            // Select (if limit not reached)
            if (selectedSubjects.size < maxSelections) {
              selectedSubjects.add(id);
              btn.setAttribute('aria-pressed', 'true');
              
              // Visual active
              btn.classList.replace('bg-card', 'bg-surface-container');
              btn.classList.replace('border-transparent', 'border-accent-emerald');
              btn.classList.remove('hover:bg-surface-container-low');
              btn.classList.add('border-2'); // Ensure border width is set
              
              const iconContainer = btn.querySelector('.icon-container');
              iconContainer.classList.replace('bg-surface-container', 'bg-accent-emerald');
              iconContainer.classList.replace('text-on-surface-variant', 'text-white');
              
              const checkContainer = btn.querySelector('.check-container');
              checkContainer.classList.replace('border-outline-light', 'bg-accent-emerald');
              checkContainer.classList.add('border-transparent');
              
              const checkIcon = btn.querySelector('.material-symbols-outlined:last-child');
              checkIcon.classList.replace('opacity-0', 'opacity-100');
              checkIcon.classList.replace('scale-50', 'scale-100');
              checkIcon.style.fontVariationSettings = "'FILL' 1";
            }
          }
          
          updateUI();
        });
      });
      
      // Initial UI sync
      updateUI();
    });
  </script>
