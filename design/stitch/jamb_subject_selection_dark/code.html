<div class="flex flex-col gap-sm">
<h1 class="font-display-lg text-dark-text-primary mt-md">Configure Mock Exam</h1>
<p class="font-body-secondary text-dark-text-secondary">Select your 4 JAMB subjects. English Language is mandatory.</p>
</div>
<div class="flex flex-col gap-md">
<h2 class="font-section-title text-dark-text-primary">Selected Subjects (1/4)</h2>
<div class="flex flex-wrap gap-sm" id="selected-chips">
<button class="px-md py-sm bg-accent-emerald/20 text-accent-emerald rounded-full font-body-medium flex items-center gap-xs pointer-events-none">
        English Language
        <span class="material-symbols-outlined text-[18px]">lock</span>
</button>
</div>
</div>
<div class="flex flex-col gap-md flex-1">
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-dark">search</span>
<input class="w-full bg-dark-surface-low text-dark-text-primary font-body-base py-md pl-xl pr-md rounded-lg focus:outline-none focus:ring-1 focus:ring-accent-emerald transition-all placeholder:text-outline-dark" id="subject-search" placeholder="Search subjects..." type="text"/>
</div>
<div class="grid grid-cols-2 gap-sm pb-24 overflow-y-auto" id="subject-grid">
<button class="subject-card flex flex-col items-center justify-center p-md bg-dark-card rounded-xl gap-sm transition-all shadow-sm" data-subject="Mathematics">

</button>

<span class="material-symbols-outlined text-[32px] text-accent-amber">science</span>

</button>

<span class="material-symbols-outlined text-[32px] text-accent-emerald">experiment</span>

<span class="material-symbols-outlined text-[32px] text-accent-emerald">biotech</span>

<span class="material-symbols-outlined text-[32px] text-accent-amber">trending_up</span>

</button>

<span class="font-body-medium text-dark-text-primary text-center">Geography</span>

</div>
<div class="fixed bottom-0 left-0 right-0 p-margin-mobile bg-dark-surface/90 backdrop-blur-xl shadow-[0_-4px_20px_rgba(0,0,0,0.2)] z-10 pb-safe">
<button class="w-full h-[52px] bg-white text-black font-body-medium rounded-[10px] opacity-50 cursor-not-allowed transition-opacity flex items-center justify-center gap-xs" id="start-exam-btn">
      Start Mock Exam
      <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const cards = document.querySelectorAll('.subject-card');
    const selectedChipsContainer = document.getElementById('selected-chips');
    const startBtn = document.getElementById('start-exam-btn');
    const searchInput = document.getElementById('subject-search');
    const titleCounter = document.querySelector('h2');
    
    let selectedSubjects = ['English Language'];

    function updateUI() {
      // Update Counter
      titleCounter.textContent = `Selected Subjects (${selectedSubjects.length}/4)`;

      // Update Button State
      if (selectedSubjects.length === 4) {
        startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        startBtn.classList.add('hover:bg-gray-200');
      } else {
        startBtn.classList.add('opacity-50', 'cursor-not-allowed');
        startBtn.classList.remove('hover:bg-gray-200');
      }

      // Re-render chips (keeping English fixed)
      selectedChipsContainer.innerHTML = `
        <button class="px-md py-sm bg-accent-emerald/20 text-accent-emerald rounded-full font-body-medium flex items-center gap-xs pointer-events-none">
          English Language
          <span class="material-symbols-outlined text-[18px]">lock</span>
        </button>
      `;

      selectedSubjects.forEach(subject => {
        if (subject === 'English Language') return;
        
        const chip = document.createElement('button');
        chip.className = 'px-md py-sm bg-dark-surface-low text-dark-text-primary rounded-full font-body-medium flex items-center gap-xs transition-colors hover:bg-dark-card border border-dark-card';
        chip.innerHTML = `
          ${subject}
          <span class="material-symbols-outlined text-[18px]">close</span>
        `;
        chip.onclick = () => toggleSubject(subject);
        selectedChipsContainer.appendChild(chip);
      });

      // Update Card Visuals
      cards.forEach(card => {
        const subject = card.dataset.subject;
        if (selectedSubjects.includes(subject)) {
          card.classList.add('bg-accent-emerald/10', 'ring-2', 'ring-accent-emerald');
          card.classList.remove('bg-dark-card');
        } else {
          card.classList.remove('bg-accent-emerald/10', 'ring-2', 'ring-accent-emerald');
          card.classList.add('bg-dark-card');
        }
      });
    }

    function toggleSubject(subject) {
      if (selectedSubjects.includes(subject)) {
        selectedSubjects = selectedSubjects.filter(s => s !== subject);
      } else {
        if (selectedSubjects.length < 4) {
          selectedSubjects.push(subject);
          
          // Delightful micro-interaction on select
          const card = Array.from(cards).find(c => c.dataset.subject === subject);
          if (card) {
            card.style.transform = 'scale(0.95)';
            setTimeout(() => card.style.transform = 'scale(1)', 150);
          }
        } else {
          // Shake effect if trying to select more than 4
          titleCounter.style.transform = 'translateX(5px)';
          setTimeout(() => titleCounter.style.transform = 'translateX(-5px)', 50);
          setTimeout(() => titleCounter.style.transform = 'translateX(5px)', 100);
          setTimeout(() => titleCounter.style.transform = 'translateX(0)', 150);
        }
      }
      updateUI();
    }

    cards.forEach(card => {
      card.addEventListener('click', () => {
        toggleSubject(card.dataset.subject);
      });
    });

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      cards.forEach(card => {
        const subject = card.dataset.subject.toLowerCase();
        if (subject.includes(term)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    });
    
    // Initial render
    updateUI();
  });
</script></main><nav class="fixed bottom-0 w-full z-50 bg-white/90 backdrop-blur-xl pb-safe shadow-[0_-1px_8px_rgba(0,0,0,0.04)] rounded-t-xl" data-active-classes="text-primary active-tab"><div class="flex justify-between items-center h-16 px-md"><a class="flex flex-col items-center justify-center flex-1 gap-xs text-on-surface-variant transition-colors" data-path="home-dashboard" href="#"><span class="material-symbols-outlined">home</span><span class="font-caption">Home</span></a><a class="flex flex-col items-center justify-center flex-1 gap-xs text-on-surface-variant transition-colors" data-path="practice-arena" href="#"><span class="material-symbols-outlined">edit_note</span><span class="font-caption">Practice</span></a><a class="flex flex-col items-center justify-center flex-1 gap-xs text-on-surface-variant transition-colors" data-path="review-center" href="#"><span class="material-symbols-outlined">history_edu</span><span class="font-caption">Review</span></a><a class="flex flex-col items-center justify-center flex-1 gap-xs text-on-surface-variant transition-colors" data-path="learning-progress" href="#"><span class="material-symbols-outlined">leaderboard</span><span class="font-caption">Progress</span></a><a aria-current="page" class="flex flex-col items-center justify-center flex-1 gap-xs transition-colors text-primary active-tab" data-path="user-profile" href="#"><span class="material-symbols-outlined">person</span><span class="font-caption">Profile</span></a></div></nav><style>.active-tab .material-symbols-outlined { font-variation-settings: 'FILL' 1; }.active-tab::after { content: ''; width: 4px; height: 4px; background: currentColor; border-radius: 999px; margin-top: 2px; }</style></body></html>
