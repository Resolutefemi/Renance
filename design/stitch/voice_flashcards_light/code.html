<!-- Header / Context -->
<div class="flex items-center justify-between w-full px-xs">
<div class="flex items-center gap-sm text-text-secondary">
<span class="material-symbols-outlined text-[20px]">headphones</span>
<span class="font-body-medium text-body-medium">Biology 101</span>
</div>
<div class="font-stat-number text-stat-number text-on-surface tracking-tight">
            4<span class="text-text-secondary">/20</span>
</div>
</div>
<!-- Main Card Stage -->
<div class="flex flex-col flex-1 items-center justify-center bg-card rounded-xl shadow-[0_1px_3px_0_rgba(20,28,45,0.20)] p-lg relative overflow-hidden h-[60vh]" id="flashcard-stage">
<!-- Question Text -->
<h2 class="font-display-lg text-display-lg text-on-surface text-center mb-xl transition-opacity duration-300" id="card-text">
            What is the powerhouse of the cell?
        </h2>
<!-- Answer Text (Hidden Initially) -->
<h2 class="font-display-lg text-display-lg text-accent-emerald text-center mb-xl absolute opacity-0 transition-opacity duration-300 pointer-events-none transform scale-95 translate-y-4" id="answer-text">
            Mitochondria
        </h2>
<!-- Audio / Waveform Element -->
<div class="flex items-center gap-md bg-surface-container-low rounded-full p-2 pr-6 shadow-[0_1px_3px_0_rgba(20,28,45,0.05)] cursor-pointer active:scale-95 transition-transform" id="audio-playback">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface text-accent-violet shadow-[0_1px_3px_0_rgba(20,28,45,0.12)]">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<div class="flex items-center gap-[3px] h-6" id="waveform">
<div class="w-1.5 h-full bg-selection-blue rounded-full origin-bottom animate-[wave_1s_ease-in-out_infinite]" style="animation-delay: 0s;"></div>
<div class="w-1.5 h-3/4 bg-selection-blue rounded-full origin-bottom animate-[wave_1s_ease-in-out_infinite]" style="animation-delay: 0.2s;"></div>
<div class="w-1.5 h-1/2 bg-selection-blue rounded-full origin-bottom animate-[wave_1s_ease-in-out_infinite]" style="animation-delay: 0.4s;"></div>
<div class="w-1.5 h-full bg-selection-blue rounded-full origin-bottom animate-[wave_1s_ease-in-out_infinite]" style="animation-delay: 0.1s;"></div>
<div class="w-1.5 h-2/3 bg-selection-blue rounded-full origin-bottom animate-[wave_1s_ease-in-out_infinite]" style="animation-delay: 0.3s;"></div>
</div>
</div>
</div>
<!-- Bottom Controls -->
<div class="mt-auto pt-md w-full flex gap-sm">
<button class="w-full h-[52px] bg-primary text-on-primary rounded-[10px] font-body-medium text-body-medium flex items-center justify-center transition-transform active:scale-[0.98]" id="reveal-btn">
            Reveal
        </button>
<div class="w-full hidden gap-sm" id="feedback-btns">
<button class="flex-1 h-[52px] bg-error-container text-on-error-container rounded-[10px] font-body-medium text-body-medium flex items-center justify-center active:scale-[0.98] transition-transform">
                Again
            </button>
<button class="flex-1 h-[52px] bg-secondary-container text-on-secondary-container rounded-[10px] font-body-medium text-body-medium flex items-center justify-center active:scale-[0.98] transition-transform">
                Hard
            </button>
<button class="flex-1 h-[52px] bg-surface-container-high text-on-surface rounded-[10px] font-body-medium text-body-medium flex items-center justify-center active:scale-[0.98] transition-transform">
                Good
            </button>
</div>
</div>
</div>
<style>
@keyframes wave {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
}
</style>
<script>
    document.getElementById('reveal-btn').addEventListener('click', function() {
        // Hide Reveal Button
        this.classList.add('hidden');
        
        // Show Feedback Buttons
        const feedbackBtns = document.getElementById('feedback-btns');
        feedbackBtns.classList.remove('hidden');
        feedbackBtns.classList.add('flex');

        // Transition Texts
        const questionText = document.getElementById('card-text');
        const answerText = document.getElementById('answer-text');
        
        questionText.classList.add('opacity-0', 'scale-95', '-translate-y-4');
        questionText.classList.remove('opacity-100', 'scale-100', 'translate-y-0');
        questionText.style.position = 'absolute';
        questionText.style.pointerEvents = 'none';

        answerText.classList.remove('opacity-0', 'scale-95', 'translate-y-4');
        answerText.classList.add('opacity-100', 'scale-100', 'translate-y-0');
        answerText.style.position = 'relative';
        
        // Pause Waveform
        const bars = document.querySelectorAll('#waveform div');
        bars.forEach(bar => {
            bar.style.animationPlayState = 'paused';
            bar.style.transform = 'scaleY(0.2)';
            bar.classList.add('transition-transform', 'duration-500');
        });
    });

    document.getElementById('audio-playback').addEventListener('click', function() {
        const icon = this.querySelector('.material-symbols-outlined');
        const bars = document.querySelectorAll('#waveform div');
        
        if (icon.innerText === 'play_arrow') {
            icon.innerText = 'pause';
            bars.forEach(bar => bar.style.animationPlayState = 'running');
        } else {
            icon.innerText = 'play_arrow';
            bars.forEach(bar => bar.style.animationPlayState = 'paused');
        }
    });
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-card shadow-[0_-2px_12px_rgba(0,0,0,0.05)] rounded-t-xl" data-active-classes="text-primary font-bold"><div class="flex justify-between items-center h-16 px-sm"><a aria-current="page" class="flex flex-col items-center justify-center flex-1 h-full gap-xs transition-colors text-primary font-bold" data-path="dashboard" href="#"><span class="material-symbols-outlined">home</span><span class="text-caption">Home</span></a><a class="flex flex-col items-center justify-center flex-1 h-full gap-xs text-text-secondary transition-colors" data-path="practice-session" href="#"><span class="material-symbols-outlined">fitness_center</span><span class="text-caption">Practice</span></a><a class="flex flex-col items-center justify-center flex-1 h-full gap-xs text-text-secondary transition-colors" data-path="daily-review" href="#"><span class="material-symbols-outlined">history_edu</span><span class="text-caption">Review</span></a><a class="flex flex-col items-center justify-center flex-1 h-full gap-xs text-text-secondary transition-colors" data-path="learning-stats" href="#"><span class="material-symbols-outlined">bar_chart</span><span class="text-caption">Progress</span></a><a class="flex flex-col items-center justify-center flex-1 h-full gap-xs text-text-secondary transition-colors" data-path="user-settings" href="#"><span class="material-symbols-outlined">person</span><span class="text-caption">Profile</span></a></div></nav></body></html>
