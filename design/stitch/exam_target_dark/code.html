<script>
  document.addEventListener('DOMContentLoaded', () => {
    const cards = document.querySelectorAll('.exam-card');
    
    cards.forEach(card => {
      card.addEventListener('click', () => {
        // Reset all cards
        cards.forEach(c => {
          c.setAttribute('data-selected', 'false');
          c.className = 'exam-card group relative flex items-center gap-md p-4 rounded-xl bg-dark-card shadow-sm transition-all duration-300 text-left overflow-hidden ring-0 ring-transparent';
          c.querySelector('.bg-dark-card, .bg-dark-surface-low').className = 'relative w-12 h-12 rounded-full bg-dark-surface-low flex items-center justify-center shrink-0 border border-transparent transition-colors';
          c.querySelector('.material-symbols-outlined.text-accent-emerald').className = 'relative material-symbols-outlined text-accent-emerald opacity-0 scale-50 transition-all duration-300';
          c.querySelector('.material-symbols-outlined:not(.text-accent-emerald)').classList.remove('text-accent-emerald');
          c.querySelector('.material-symbols-outlined:not(.text-accent-emerald)').classList.add('text-dark-text-secondary');
          c.querySelector('.absolute.inset-0').className = 'absolute inset-0 bg-accent-emerald/5 opacity-0 group-hover:opacity-100 transition-opacity';
        });

        // Set selected card
        card.setAttribute('data-selected', 'true');
        card.className = 'exam-card group relative flex items-center gap-md p-4 rounded-xl bg-dark-surface shadow-sm transition-all duration-300 text-left overflow-hidden ring-2 ring-accent-emerald';
        card.querySelector('.bg-dark-surface-low').className = 'relative w-12 h-12 rounded-full bg-dark-card flex items-center justify-center shrink-0 shadow-sm border border-accent-emerald/30';
        card.querySelector('.material-symbols-outlined:not(.text-accent-emerald)').classList.remove('text-dark-text-secondary');
        card.querySelector('.material-symbols-outlined:not(.text-accent-emerald)').classList.add('text-accent-emerald');
        card.querySelector('.material-symbols-outlined.text-accent-emerald:last-child').className = 'relative material-symbols-outlined text-accent-emerald opacity-100 scale-100 transition-all duration-300';
        card.querySelector('.absolute.inset-0').className = 'absolute inset-0 bg-accent-emerald/5 opacity-100 transition-opacity';
      });
    });
  });
